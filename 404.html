<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 | 陈工的世界</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="assets/style.css">
<script>
(function () {
  var d = document.documentElement;
  d.classList.add('js');
  try {
    var t = localStorage.getItem('theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    d.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
</head>
<body>
<main id="main" style="min-height:100vh;display:grid;place-items:center;padding:80px 24px;text-align:center">
  <div style="max-width:520px">
    <p class="eyebrow" style="justify-content:center">404</p>
    <h1 class="hero-title" style="font-size:clamp(2.2rem,5vw,3.2rem);margin-top:16px">
      <span class="gradient-text">页面走丢了</span>
    </h1>
    <p class="section-sub" style="margin-top:20px">
      你访问的地址不存在，或者已经迁移。回首页继续逛逛吧。
    </p>
    <div class="hero-actions" style="justify-content:center;margin-top:32px">
      <a class="btn btn-primary" href="index.html">返回首页</a>
      <a class="btn btn-ghost" href="contact.html">联系我</a>
    </div>
  </div>
</main>
</body>
</html>
